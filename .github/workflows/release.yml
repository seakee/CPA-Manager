name: Build and Release

on:
  push:
    tags:
      - 'v*-custom-*'
  workflow_dispatch:

jobs:
  validate-release-tag:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.validate.outputs.should_release }}
    steps:
      - name: Validate custom release tag
        id: validate
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-custom-[0-9]+$ ]]; then
            echo "::error::Invalid custom release tag: ${tag}"
            echo "::error::Expected format: v<upstream-version>-custom-<number>, for example v1.2.55-custom-1"
            exit 1
          fi
          echo "should_release=true" >> "${GITHUB_OUTPUT}"

  build-and-release:
    needs: validate-release-tag
    if: needs.validate-release-tag.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: usage-service/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Build all-in-one HTML
        run: npm run build
        env:
          VERSION: ${{ github.ref_name }}

      - name: Build native release packages
        run: bin/release/package-native.sh
        env:
          VERSION: ${{ github.ref_name }}

      - name: Prepare release assets
        run: |
          cd dist
          mv index.html management.html
          ls -lh management.html

      - name: Generate release notes
        run: |
          set -euo pipefail
          current_tag="${GITHUB_REF_NAME}"
          : > release-notes.md

          if [ -f CHANGELOG.md ]; then
            awk -v tag="${current_tag}" '
              BEGIN { found = 0 }
              /^##[[:space:]]+/ {
                if (found) exit
                if (index($0, tag) > 0) found = 1
              }
              found { print }
            ' CHANGELOG.md > release-notes.md
          fi

          if [ ! -s release-notes.md ]; then
            release_date="$(date -u +%Y-%m-%d)"
            sed \
              -e "s/{{TAG}}/${current_tag}/g" \
              -e "s/{{DATE}}/${release_date}/g" \
              .github/release-notes-template.md > release-notes.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            dist/management.html
            dist/native/*
          body_path: release-notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
