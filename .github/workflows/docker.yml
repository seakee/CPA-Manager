name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*-custom-*'
  workflow_dispatch:
    inputs:
      custom_version:
        description: 'Custom version tag, for example v1.2.55-custom-1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_IMAGE: nnnmdzz2/cpa-manager

jobs:
  validate-custom-version:
    name: Validate Custom Version
    runs-on: ubuntu-latest
    outputs:
      custom_version: ${{ steps.validate.outputs.custom_version }}
    steps:
      - name: Validate custom version
        id: validate
        env:
          CUSTOM_VERSION_INPUT: ${{ inputs.custom_version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            custom_version="${CUSTOM_VERSION_INPUT}"
          else
            custom_version="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${custom_version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-custom-[0-9]+$ ]]; then
            echo "::error::Invalid custom version: ${custom_version}"
            echo "::error::Expected format: v<upstream-version>-custom-<number>, for example v1.2.55-custom-1"
            exit 1
          fi

          echo "custom_version=${custom_version}" >> "${GITHUB_OUTPUT}"

  frontend-test:
    name: Frontend Test
    needs: validate-custom-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  usage-service-test:
    name: Usage Service Test
    needs: validate-custom-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: usage-service/go.sum

      - name: Test
        working-directory: usage-service
        run: go test ./...

  docker:
    name: Build and Push
    needs:
      - validate-custom-version
      - frontend-test
      - usage-service-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Hub credentials
        run: |
          set -eu
          if [ -z "${DOCKERHUB_USERNAME:-}" ]; then
            echo "::error::DOCKERHUB_USERNAME secret is not set"
            exit 1
          fi
          if [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "::error::DOCKERHUB_TOKEN secret is not set"
            exit 1
          fi
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.usage-service
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.DOCKERHUB_IMAGE }}:latest
            ${{ env.DOCKERHUB_IMAGE }}:custom
            ${{ env.DOCKERHUB_IMAGE }}:${{ needs.validate-custom-version.outputs.custom_version }}
          build-args: |
            VERSION=${{ needs.validate-custom-version.outputs.custom_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
